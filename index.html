<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For You</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="scroll-container">
        <!-- Start Section -->
        <section class="section hero sparks-section">
            <div id="sparks-container-start" class="sparks-container"></div>
            <div class="content">
                <p class="story-text">Tap para empezar</p>
            </div>
        </section>

        <!-- Hero Section -->
        <section class="section">
            <div class="content">
                <p id="hero-message" class="story-text">
                    A todas esas pequeñas chispas dentro de ti, hechas de sueños y esperanzas.
                </p>
            </div>
        </section>

        <!-- Story Section 1 -->
        <section class="section story hero-bg" id="section-2">
            <div class="content">
                <div class="text-with-sparks">
                    <div id="sparks-container-2" class="sparks-container text-sparks"></div>
                    <p class="story-text">Sin importar dónde estés,</p>
                </div>
                <div class="polaroids-container">
                    <div class="polaroid p1">
                        <img src="assets/LAUD Bogota.jpeg" alt="Bogotá">
                        <div class="caption">BOGOTÁ</div>
                    </div>
                    <div class="polaroid p2">
                        <img src="assets/descarga.png" alt="Download">
                        <div class="caption">RIOHACHA</div>
                    </div>
                    <div class="polaroid p3">
                        <img src="assets/Barcelona_Foto 1_A Sagrada Familia.jpg" alt="Barcelona">
                        <div class="caption">BARCELONA</div>
                    </div>
                </div>
                <div class="text-with-sparks">
                    <div id="sparks-container-3" class="sparks-container text-sparks"></div>
                    <p class="story-text">espero que</p>
                </div>
            </div>
            </div>
        </section>

        <!-- Sunrise Section -->
        <section class="section sunrise-section" id="section-sunrise">
            <div class="sky-background"></div>
            <div class="beam-layer">
                <div class="light-beam"></div>
            </div>
            <div class="sun-layer">
                <div class="sun"></div>
            </div>
            <div class="spotlight-target">
                <div class="flame-container">
                    <div id="ember-container" class="ember-container"></div>
                    <div class="flame">
                        <div class="flame-layer flame-red"></div>
                        <div class="flame-layer flame-orange"></div>
                        <div class="flame-layer flame-yellow"></div>
                        <div class="flame-layer flame-white"></div>
                    </div>
                    <div class="flame-glow"></div>
                </div>
                <p class="story-text dark-text" style="margin-top: 1rem;">Todos los días un rayo de sol las alimente y
                    las haga crecer hasta que se hagan realidad.
                </p>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>

</html>
